components:
  schemas:
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    ActivationRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
      required:
      - token
      - uid
    AutoevaluacionMidas:
      type: object
      description: |-
        Serializer para mostrar los detalles de una autoevaluación MIDAS.
        Incluye el puntaje total, grado de discapacidad y las respuestas individuales.
      properties:
        id:
          type: integer
          readOnly: true
        fecha_autoevaluacion:
          type: string
          readOnly: true
        puntaje_total:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Puntaje total de la autoevaluación MIDAS
        grado_discapacidad:
          enum:
          - I
          - II
          - III
          - IV
          - ''
          type: string
          description: |-
            * `I` - Grado I - Discapacidad mínima
            * `II` - Grado II - Discapacidad leve
            * `III` - Grado III - Discapacidad moderada
            * `IV` - Grado IV - Discapacidad severa
          x-spec-enum-id: b30a75c70028edf0
          title: Grado de Discapacidad
        respuestas_midas_individuales:
          type: array
          items:
            $ref: '#/components/schemas/Respuesta'
          readOnly: true
      required:
      - fecha_autoevaluacion
      - id
      - respuestas_midas_individuales
    AutoevaluacionMidasRequest:
      type: object
      description: |-
        Serializer para mostrar los detalles de una autoevaluación MIDAS.
        Incluye el puntaje total, grado de discapacidad y las respuestas individuales.
      properties:
        puntaje_total:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Puntaje total de la autoevaluación MIDAS
        grado_discapacidad:
          enum:
          - I
          - II
          - III
          - IV
          - ''
          type: string
          description: |-
            * `I` - Grado I - Discapacidad mínima
            * `II` - Grado II - Discapacidad leve
            * `III` - Grado III - Discapacidad moderada
            * `IV` - Grado IV - Discapacidad severa
          x-spec-enum-id: b30a75c70028edf0
          title: Grado de Discapacidad
    ConfirmarToma:
      type: object
      description: Serializer para confirmar toma de medicamento
      properties:
        alerta_id:
          type: integer
        estado:
          enum:
          - tomado
          - no_tomado
          - tomado_tarde
          - tomado_muy_tarde
          type: string
          description: |-
            * `tomado` - Tomado
            * `no_tomado` - No tomado
            * `tomado_tarde` - Tomado tarde
            * `tomado_muy_tarde` - Tomado muy tarde
          x-spec-enum-id: f69ddd74a4bc7046
        fecha_confirmacion:
          type: string
          format: date-time
      required:
      - alerta_id
      - estado
    ConfirmarTomaRequest:
      type: object
      description: Serializer para confirmar toma de medicamento
      properties:
        alerta_id:
          type: integer
        estado:
          enum:
